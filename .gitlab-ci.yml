# GitLab CI/CD configuration for the MITCH pytest suite.
#
# NOTE:
# Some tests rely on the default Settings values and expected input files.
# Tests may fail if the default settings have been changed, paths are
# incorrect, or required data and dependencies are unavailable.

image: python:3.12-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MPLBACKEND: "Agg"
  PYTHONUNBUFFERED: "1"
  PIP_ROOT_USER_ACTION: "ignore"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip/

pytest:
  stage: test

  before_script:
    - python --version
    - python -m pip --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install pytest pytest-cov

  script:
    - >
      python -m pytest
      tests/
      -v
      --junitxml=report.xml
      --cov=URModbus
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --cov-report=html:htmlcov

  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'

  artifacts:
    when: always
    expire_in: 30 days

    paths:
      - htmlcov/
      - report.xml
      - coverage.xml

    reports:
      junit: report.xml

      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"