name: Python tests

on:
  push:
    branches:
      - "**"

  pull_request:

  # Allows you to run the workflow manually from GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest with Python 3.12
    runs-on: ubuntu-latest

    env:
      # Prevent Matplotlib from opening graphical windows.
      MPLBACKEND: Agg

      # Display Python output immediately.
      PYTHONUNBUFFERED: "1"

      # Suppress pip's root warning inside the disposable runner.
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Run all tests
        run: |
          python -m pytest tests/ \
            -v \
            --junitxml=report.xml \
            --cov=URModbus \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            report.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 30